[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Analytics proxy - routes through first-party domain to avoid blockers
[[redirects]]
  from = "/t/v/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/t/v/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true
